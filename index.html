<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rozpočet domácnosti</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef3f9;margin:0;padding:16px;color:#172338}
main{max-width:550px;margin:auto}
h1{text-align:center;font-size:26px}
.card{background:white;padding:20px;margin:16px 0;border-radius:16px;box-shadow:0 3px 12px #0001}
.balance{background:#164b83;color:white;text-align:center}
.balance strong{font-size:32px}
input,select,button{width:100%;padding:13px;margin:7px 0;border-radius:9px;border:1px solid #ccc;font-size:16px}
button{background:#1676d2;color:white;border:0;font-weight:bold}
.income{color:#16803d}
.expense{color:#c42b37}
li{padding:12px 0;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;gap:10px}
li button{width:auto;background:#c42b37;padding:7px}
</style>
</head>
<body>
<main>
<h1>🏠 Rozpočet domácnosti</h1>
<div class="card balance">
<p>Aktuální zůstatek</p>
<strong id="balance">0 Kč</strong>
</div>
<div class="card">
<p>Příjmy: <b class="income" id="income">0 Kč</b></p>
<p>Výdaje: <b class="expense" id="expense">0 Kč</b></p>
</div>
<div class="card">
<h2>➕ Nový záznam</h2>
<form id="form">
<input id="name" placeholder="Název položky" required>
<input id="amount" type="number" min="0.01" step="0.01" placeholder="Částka v Kč" required>
<select id="type">
<option value="income">Příjem</option>
<option value="expense">Výdaj</option>
</select>
<button type="submit">Uložit</button>
</form>
</div>
<div class="card">
<h2>📋 Historie</h2>
<ul id="history" style="list-style:none;padding:0"></ul>
</div>
</main>
<script>
const key="rozpocet-domacnosti-v1";
let records=[];
try{const data=JSON.parse(localStorage.getItem(key)||"[]");if(Array.isArray(data))records=data}catch(e){}
const money=n=>new Intl.NumberFormat("cs-CZ",{style:"currency",currency:"CZK"}).format(n);
function render(){
let income=0,expense=0;
records.forEach(r=>{if(r.type==="income")income+=r.amount;else expense+=r.amount});
document.getElementById("income").textContent=money(income);
document.getElementById("expense").textContent=money(expense);
document.getElementById("balance").textContent=money(income-expense);
const list=document.getElementById("history");
list.replaceChildren();
records.slice().reverse().forEach(r=>{
const li=document.createElement("li");
const info=document.createElement("span");
info.textContent=r.name+" – "+money(r.amount);
info.className=r.type==="income"?"income":"expense";
const btn=document.createElement("button");
btn.textContent="Smazat";
btn.onclick=()=>{records=records.filter(x=>x.id!==r.id);save()};
li.append(info,btn);
list.append(li);
});
}
function save(){localStorage.setItem(key,JSON.stringify(records));render()}
document.getElementById("form").onsubmit=e=>{
e.preventDefault();
const name=document.getElementById("name").value.trim();
const amount=Number(document.getElementById("amount").value);
const type=document.getElementById("type").value;
if(!name||!Number.isFinite(amount)||amount<=0)return;
records.push({id:crypto.randomUUID(),name,amount,type});
save();
e.target.reset();
};
render();
</script>
</body>
</html>
